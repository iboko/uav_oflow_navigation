name: ci

on:
  push:
  pull_request:

jobs:
  python-and-rtos-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev,vision]'

      - name: Run Python tests
        run: pytest -q

      - name: Run deterministic synthetic map campaign
        run: |
          python -m src.synthetic_map_campaign \
            --output-dir build/synthetic_map_campaign \
            --seed 14921 \
            --frames-per-flight 120

      - name: Archive synthetic campaign reports
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-map-campaign
          path: |
            build/synthetic_map_campaign/synthetic_map_campaign.json
            build/synthetic_map_campaign/synthetic_map_scenarios.csv
          if-no-files-found: error
          retention-days: 30

      - name: Configure C++ RTOS core
        run: cmake -S firmware/rtos_core -B build/rtos_core -DOFNAV_BUILD_TESTS=ON

      - name: Build C++ RTOS core
        run: cmake --build build/rtos_core --parallel

      - name: Run C++ tests
        run: ctest --test-dir build/rtos_core --output-on-failure
