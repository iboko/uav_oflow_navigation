name: ci

on:
  push:
  pull_request:

jobs:
  python-and-rtos-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev,vision]'

      - name: Run Python tests
        run: pytest -q

      - name: Calibrate map and VO errors on separate synthetic flights
        run: |
          python -m src.synthetic_bench_calibration \
            --output build/synthetic_bench_calibration.json \
            --fit-seeds 9101 9102 9103 \
            --holdout-seeds 9201 9202

      - name: Run synthetic camera IMU map and delayed ESKF integration (VIO)
        run: |
          python -m src.synthetic_sensor_bench \
            --output-dir build/synthetic_sensor_bench \
            --scenario nominal \
            --frames 12 \
            --seed 72118 \
            --calibration build/synthetic_bench_calibration.json
          python - <<'PY'
          import json
          s = json.load(open("build/synthetic_sensor_bench/evaluation/sensor_bench_summary.json"))
          assert s["attitude_source"] == "ESKF_INTERNAL", s
          assert s["map_position_updates_fused"] >= 8, s
          assert s["eskf_position_rmse_m"] < 0.2, s
          assert s["eskf_speed_rmse_m_s"] < 0.1, s
          assert s["flight_accuracy_validated"] is False
          PY

      - name: Linearized ESKF observability report
        run: python -m src.eskf_observability --output build/eskf_observability.json

      - name: Archive synthetic camera and IMU integration results
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-camera-imu-integration
          path: |
            build/synthetic_sensor_bench/sensors/bench_metadata.json
            build/synthetic_sensor_bench/sensors/calibration.json
            build/synthetic_sensor_bench/sensors/camera.csv
            build/synthetic_sensor_bench/sensors/imu.csv
            build/synthetic_sensor_bench/sensors/truth.csv
            build/synthetic_sensor_bench/sensors/truth_imu.csv
            build/synthetic_sensor_bench/sensors/frame_002.png
            build/synthetic_sensor_bench/sensors/synthetic_orthophoto.png
            build/synthetic_sensor_bench/evaluation/sensor_bench_results.csv
            build/synthetic_sensor_bench/evaluation/sensor_bench_summary.json
            build/synthetic_bench_calibration.json
            build/eskf_observability.json
          if-no-files-found: error
          retention-days: 30

      - name: Configure C++ RTOS core
        run: cmake -S firmware/rtos_core -B build/rtos_core -DOFNAV_BUILD_TESTS=ON

      - name: Build C++ RTOS core
        run: cmake --build build/rtos_core --parallel

      - name: Run C++ tests
        run: ctest --test-dir build/rtos_core --output-on-failure

      - name: Measure ESKF stack and time with full buffers
        run: |
          mkdir -p build/eskf15_resources
          build/rtos_core/eskf15_benchmark | tee build/eskf15_resources/host_resources.json

      - name: Compare full C++15 ESKF against Python delayed replay
        run: |
          python -m src.compare_cpp15_python \
            --cpp-executable build/rtos_core/eskf15_parity \
            --output build/eskf15_parity/cpp_python_full_covariance.json

      - name: Archive C++15 Python mathematical parity report
        uses: actions/upload-artifact@v4
        with:
          name: cpp15-python-full-covariance-parity
          path: |
            build/eskf15_parity/cpp_python_full_covariance.json
            build/eskf15_resources/host_resources.json
          if-no-files-found: error
          retention-days: 30

