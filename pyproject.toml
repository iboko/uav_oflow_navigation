[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "uav-oflow-navigation"
version = "0.2.0"
description = "Optical-flow navigation prototype and RTOS-oriented core for UAV low-altitude GNSS-denied flight"
readme = "README_RU.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "PyYAML>=6.0",
    "pymavlink>=2.4.40",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
include = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
